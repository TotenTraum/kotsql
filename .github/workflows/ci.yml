name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  jvm:
    name: JVM, compatibility and module boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper downloads Gradle on a fresh runner, which can time out while several jobs do it at once.
      - name: Download Gradle
        run: for attempt in 1 2 3; do echo "Attempt $attempt"; ./gradlew --version -q && exit 0; sleep 15; done; exit 1
      # The JDBC, R2DBC and compatibility suites start their databases through Testcontainers.
      - run: ./gradlew jvmTest :kotsql-compat-tests:test checkModuleBoundaries --continue
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/'

  client-linux:
    name: Client and TLS tests, JVM, linuxX64 and mingwX64 under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper downloads Gradle on a fresh runner, which can time out while several jobs do it at once.
      - name: Download Gradle
        run: for attempt in 1 2 3; do echo "Attempt $attempt"; ./gradlew --version -q && exit 0; sleep 15; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # The mingwX64 tests too, under Wine, against the same servers with TLS and client certificates.
      - run: tools/run-client-tests.sh
        env:
          KOTSQL_TEST_WINE: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports
          path: '**/build/reports/tests/'

  macos:
    name: macosArm64, without a database
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper downloads Gradle on a fresh runner, which can time out while several jobs do it at once.
      - name: Download Gradle
        run: for attempt in 1 2 3; do echo "Attempt $attempt"; ./gradlew --version -q && exit 0; sleep 15; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # No Docker on these runners: the tests that need a server skip themselves, and SQLite, the fuzzing and the rest run.
      - run: ./gradlew macosArm64Test --continue
      # Here, where every target compiles, so the dumps of all of them are compared.
      - name: Public API against the dumps in api/
        run: ./gradlew checkKotlinAbi

  windows:
    name: mingwX64 on Windows, with the runner's PostgreSQL
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper downloads Gradle on a fresh runner, which can time out while several jobs do it at once.
      - name: Download Gradle
        run: for attempt in 1 2 3; do echo "Attempt $attempt"; ./gradlew --version -q && exit 0; sleep 15; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # The image has PostgreSQL installed but stopped, its paths in PGDATA and PGBIN. TLS with a certificate for localhost,
      # as the TLS tests expect, so that they run on Windows itself and not only under Wine.
      - name: Enable TLS in PostgreSQL
        run: |
          data=$(cygpath -u "$PGDATA")
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$data/server.key" -out "$data/server.crt" \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost -days 2
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null -out "$RUNNER_TEMP/other.pem" -subj /CN=unrelated -days 2
          cp "$data/server.crt" "$RUNNER_TEMP/root.pem"
          echo "ssl = on" >> "$data/postgresql.conf"
          {
            echo "KOTSQL_TEST_TLS_ROOT=$(cygpath -m "$RUNNER_TEMP/root.pem")"
            echo "KOTSQL_TEST_TLS_OTHER_ROOT=$(cygpath -m "$RUNNER_TEMP/other.pem")"
          } >> "$GITHUB_ENV"
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -Status running -StartupType automatic
      # The user and database the TLS tests log in to, and the roles of the SCRAM tests, as TestServers.kt creates them.
      - name: Create the test roles
        env:
          PGPASSWORD: root
        run: |
          "$(cygpath -u "$PGBIN")/psql" -h localhost -U postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          CREATE ROLE kotsql LOGIN SUPERUSER PASSWORD 'kotsql';
          CREATE DATABASE kotsql OWNER kotsql;
          CREATE ROLE kotsql_prep LOGIN PASSWORD U&'pa\00ADss\00A0word';
          CREATE ROLE kotsql_nfkc LOGIN PASSWORD U&'caf\00E9';
          SQL
      - run: ./gradlew mingwX64Test --continue
        env:
          KOTSQL_TEST_URL: postgresql://kotsql:kotsql@localhost:5432/kotsql?sslmode=disable
          KOTSQL_TEST_SCRAM_URL: postgresql://kotsql:kotsql@localhost:5432/kotsql
          KOTSQL_TEST_TLS_PORT: 5432
          KOTSQL_TEST_TLS_OTHER_HOST: 127.0.0.1
          KOTSQL_TEST_NFKC: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: '**/build/reports/tests/'

  openssl:
    name: OpenSSL declarations against the headers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-openssl-decls.sh

  soak:
    name: Short soak, JVM and linuxX64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper downloads Gradle on a fresh runner, which can time out while several jobs do it at once.
      - name: Download Gradle
        run: for attempt in 1 2 3; do echo "Attempt $attempt"; ./gradlew --version -q && exit 0; sleep 15; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: tools/run-soak.sh 120
