# Postgres with TLS for the client tests that run on every target. See "Tests" in README.md.
name: kotsql
services:
  # Only with --profile mysql, so as not to add an idle server to the benchmarks.
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    command: --mysql-native-password=ON
    environment: { MYSQL_ROOT_PASSWORD: kotsql, MYSQL_DATABASE: kotsql }
    ports: ["53306:3306"]
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -pkotsql --silent
      interval: 2s
      retries: 60
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    environment: { POSTGRES_USER: kotsql, POSTGRES_PASSWORD: kotsql, POSTGRES_DB: kotsql }
    # The benchmarks' clients share this network namespace, and opening ~1500 connections a second would otherwise run out
    # of local ports, each closed one keeping its port for a minute.
    sysctls: { net.ipv4.ip_local_port_range: "1024 65000", net.ipv4.tcp_tw_reuse: "1" }
    ports: ["55432:5432"]
    healthcheck:
      test: pg_isready -U kotsql
      interval: 1s
      retries: 30
  # Only with --profile replica. A streaming replica of postgres, for the tests of failover, which must allow replication first.
  postgres-standby:
    image: postgres:17
    profiles: [replica]
    user: postgres
    environment: { PGPASSWORD: kotsql }
    entrypoint:
      - sh
      - -c
      - |
        until pg_basebackup -h postgres -U kotsql -D /tmp/standby -R -X stream; do rm -rf /tmp/standby; sleep 1; done
        chmod 700 /tmp/standby
        exec postgres -D /tmp/standby -c ssl=off
    ports: ["55433:5432"]
    healthcheck:
      test: pg_isready -U kotsql -h 127.0.0.1
      interval: 1s
      retries: 60
