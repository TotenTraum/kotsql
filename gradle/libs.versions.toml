[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
datetime = "0.8.0"
ktor = "3.6.1"
cryptography = "0.6.0"
openssl = "3.6.5"
r2dbc = "1.0.0.RELEASE"
r2dbcPool = "1.0.2.RELEASE"
testcontainers = "2.0.5"
junit = "5.13.4"
spring = "6.2.12"
hikari = "7.1.0"
flyway = "13.12.0"
jooq = "3.19.28"
pgjdbc = "42.7.14"
jmh = "1.37"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-random = { module = "dev.whyoleg.cryptography:cryptography-random", version.ref = "cryptography" }
cryptography-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
cryptography-openssl = { module = "dev.whyoleg.cryptography:cryptography-provider-openssl3-prebuilt-nativebuilds", version.ref = "cryptography" }
openssl-libcrypto = { module = "com.ensody.nativebuilds:openssl-libcrypto", version.ref = "openssl" }
openssl-libssl = { module = "com.ensody.nativebuilds:openssl-libssl", version.ref = "openssl" }
r2dbc-spi = { module = "io.r2dbc:r2dbc-spi", version.ref = "r2dbc" }
r2dbc-spi-test = { module = "io.r2dbc:r2dbc-spi-test", version.ref = "r2dbc" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbcPool" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.13.4" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring" }
spring-r2dbc = { module = "org.springframework:spring-r2dbc", version.ref = "spring" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version = "1.1.3.RELEASE" }
pgjdbc = { module = "org.postgresql:postgresql", version.ref = "pgjdbc" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-processor = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
reactor-core = { module = "io.projectreactor:reactor-core", version = "3.7.12" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
